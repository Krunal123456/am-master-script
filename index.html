<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AM Master Script Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Inter, Arial, sans-serif;
  background: #f5f7fb;
  color: #172033;
}

.header {
  background: #111827;
  color: white;
  padding: 22px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.header h1 {
  margin: 0;
  font-size: 24px;
}

.header span {
  opacity: .7;
  font-size: 13px;
}

.container {
  padding: 28px;
  max-width: 1600px;
  margin: auto;
}

.controls {
  background: white;
  padding: 18px;
  border-radius: 14px;
  margin-bottom: 24px;
  display: flex;
  gap: 12px;
  align-items: center;
  box-shadow: 0 4px 20px rgba(0,0,0,.05);
}

input,
button {
  padding: 11px 14px;
  border-radius: 8px;
  border: 1px solid #d8dee9;
}

button {
  background: #111827;
  color: white;
  cursor: pointer;
  border: 0;
}

button:hover {
  opacity: .9;
}

.status {
  margin-left: auto;
  font-size: 13px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 20px;
  box-shadow: 0 4px 20px rgba(0,0,0,.05);
}

.card .label {
  font-size: 12px;
  color: #687386;
}

.card .value {
  margin-top: 8px;
  font-size: 28px;
  font-weight: 700;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 22px;
}

.panel {
  background: white;
  border-radius: 14px;
  padding: 22px;
  box-shadow: 0 4px 20px rgba(0,0,0,.05);
}

.panel h2 {
  margin-top: 0;
  font-size: 18px;
}

.chartBox {
  height: 330px;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th,
td {
  padding: 11px;
  border-bottom: 1px solid #edf0f5;
  text-align: left;
  font-size: 13px;
}

th {
  background: #f8fafc;
}

.stale {
  color: #dc2626;
  font-weight: 700;
}

.good {
  color: #059669;
  font-weight: 700;
}

.full {
  grid-column: 1 / -1;
}

.empty {
  padding: 30px;
  text-align: center;
  color: #7b8494;
}

@media(max-width:1100px) {
  .cards {
    grid-template-columns: repeat(3,1fr);
  }
}

@media(max-width:700px) {

  .container {
    padding: 15px;
  }

  .cards {
    grid-template-columns: 1fr 1fr;
  }

  .grid {
    grid-template-columns: 1fr;
  }
}

</style>

</head>

<body>

<header class="header">

  <div>
    <h1>AM Master Script</h1>
    <span>Management Dashboard</span>
  </div>

  <span id="loadedDate"></span>

</header>


<div class="container">

  <div class="controls">

    <label>
      Date:
      <input
        type="date"
        id="datePicker"
      >
    </label>

    <button onclick="loadDashboard()">
      Load Dashboard
    </button>

    <button onclick="loadLatest()">
      Latest
    </button>

    <span
      class="status"
      id="status">
      Ready
    </span>

  </div>


  <section class="cards">

    <div class="card">
      <div class="label">AMs</div>
      <div class="value" id="totalAMs">0</div>
    </div>

    <div class="card">
      <div class="label">Accounts</div>
      <div class="value" id="totalAccounts">0</div>
    </div>

    <div class="card">
      <div class="label">Opportunities</div>
      <div class="value" id="totalOpportunities">0</div>
    </div>

    <div class="card">
      <div class="label">Stale</div>
      <div
        class="value stale"
        id="staleCount">
        0
      </div>
    </div>

    <div class="card">
      <div class="label">Open Pipeline</div>
      <div class="value" id="openPipeline">0</div>
    </div>

    <div class="card">
      <div class="label">Pipeline Value</div>
      <div class="value" id="pipelineValue">0</div>
    </div>

  </section>


  <div class="grid">

    <div class="panel">

      <h2>Pipeline by Stage</h2>

      <div class="chartBox">
        <canvas id="stageChart"></canvas>
      </div>

    </div>


    <div class="panel">

      <h2>Pipeline by AM</h2>

      <div class="chartBox">
        <canvas id="amChart"></canvas>
      </div>

    </div>


    <div class="panel">

      <h2>AM Performance</h2>

      <div id="amTable"></div>

    </div>


    <div class="panel">

      <h2>Accounts</h2>

      <div id="accountTable"></div>

    </div>


    <div class="panel full">

      <h2>Opportunities</h2>

      <div id="opportunityTable"></div>

    </div>

  </div>

</div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyZ6eMO7VRVZ521OpdJfF9OEagKnU0CdRy60T6tCHPcHor6HdXDrXavclj0fn3u5lsS/exec";


let stageChart = null;
let amChart = null;


/**
 * Load dashboard
 */
async function loadDashboard() {

  const date =
    document.getElementById("datePicker").value;

  if (!date) {

    setStatus("Select a date");

    return;
  }

  setStatus("Loading...");

  try {

    const url =
      API_URL +
      "?action=dashboard&date=" +
      encodeURIComponent(date);

    const response =
      await fetch(url, {
        method: "GET",
        cache: "no-store"
      });

    if (!response.ok) {
      throw new Error(
        "HTTP " + response.status
      );
    }

    const result =
      await response.json();

    console.log("Dashboard API:", result);

    if (!result.ok) {
      throw new Error(
        result.error ||
        "API returned an error"
      );
    }

    renderDashboard(result);

    setStatus("Loaded");

  } catch (error) {

    console.error(error);

    setStatus(
      "Error: " + error.message
    );

    showEmpty();
  }
}


/**
 * Latest
 */
async function loadLatest() {

  setStatus("Loading latest...");

  try {

    const response =
      await fetch(
        API_URL +
        "?action=dashboard",
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {
      throw new Error(
        "HTTP " + response.status
      );
    }

    const result =
      await response.json();

    console.log(
      "Latest dashboard:",
      result
    );

    if (!result.ok) {
      throw new Error(
        result.error ||
        "Unable to load dashboard"
      );
    }

    renderDashboard(result);

    if (result.actualDate) {

      document.getElementById(
        "datePicker"
      ).value = result.actualDate;
    }

    setStatus("Latest loaded");

  } catch (error) {

    console.error(error);

    setStatus(
      "Error: " + error.message
    );
  }
}


/**
 * Render
 */
function renderDashboard(result) {

  const snapshot =
    result.snapshot || {};

  const summary =
    snapshot.summary || {};

  document.getElementById(
    "loadedDate"
  ).textContent =
    result.actualDate ||
    result.date ||
    "";


  document.getElementById(
    "totalAMs"
  ).textContent =
    formatNumber(
      summary.totalAMs
    );


  document.getElementById(
    "totalAccounts"
  ).textContent =
    formatNumber(
      summary.totalAccounts
    );


  document.getElementById(
    "totalOpportunities"
  ).textContent =
    formatNumber(
      summary.totalOpportunities
    );


  document.getElementById(
    "staleCount"
  ).textContent =
    formatNumber(
      summary.staleCount
    );


  document.getElementById(
    "openPipeline"
  ).textContent =
    formatNumber(
      summary.openPipeline
    );


  document.getElementById(
    "pipelineValue"
  ).textContent =
    formatCurrency(
      summary.pipelineValue
    );


  renderStageChart(
    snapshot.stages || []
  );


  renderAMChart(
    snapshot.ams || []
  );


  renderAMTable(
    snapshot.ams || []
  );


  renderAccountTable(
    snapshot.accounts || []
  );


  renderOpportunityTable(
    snapshot.opportunities || []
  );
}


/**
 * Stage chart
 */
function renderStageChart(data) {

  const ctx =
    document
      .getElementById("stageChart")
      .getContext("2d");

  if (stageChart) {
    stageChart.destroy();
  }

  stageChart =
    new Chart(ctx, {

      type: "doughnut",

      data: {

        labels:
          data.map(
            x => x.stage
          ),

        datasets: [{

          data:
            data.map(
              x => x.value || x.count || 0
            )

        }]

      },

      options: {
        responsive: true,
        maintainAspectRatio: false
      }

    });
}


/**
 * AM chart
 */
function renderAMChart(data) {

  const ctx =
    document
      .getElementById("amChart")
      .getContext("2d");

  if (amChart) {
    amChart.destroy();
  }

  amChart =
    new Chart(ctx, {

      type: "bar",

      data: {

        labels:
          data.map(
            x => x.name
          ),

        datasets: [{

          label: "Pipeline",

          data:
            data.map(
              x => x.pipeline || 0
            )

        }]

      },

      options: {
        responsive: true,
        maintainAspectRatio: false
      }

    });
}


/**
 * AM table
 */
function renderAMTable(data) {

  if (!data.length) {

    document.getElementById(
      "amTable"
    ).innerHTML =
      '<div class="empty">No AM data</div>';

    return;
  }

  let html = `
  <table>

    <thead>
      <tr>
        <th>AM</th>
        <th>Accounts</th>
        <th>Opportunities</th>
        <th>Stale</th>
        <th>Pipeline</th>
      </tr>
    </thead>

    <tbody>
  `;

  data.forEach(x => {

    html += `
      <tr>

        <td>${safe(x.name)}</td>

        <td>${formatNumber(x.accounts)}</td>

        <td>${formatNumber(x.opportunities)}</td>

        <td class="stale">
          ${formatNumber(x.stale)}
        </td>

        <td>
          ${formatCurrency(x.pipeline)}
        </td>

      </tr>
    `;
  });

  html += `
    </tbody>
  </table>
  `;

  document.getElementById(
    "amTable"
  ).innerHTML = html;
}


/**
 * Account table
 */
function renderAccountTable(data) {

  if (!data.length) {

    document.getElementById(
      "accountTable"
    ).innerHTML =
      '<div class="empty">No account data</div>';

    return;
  }

  let html = `
  <table>

    <thead>
      <tr>
        <th>Account</th>
        <th>AM</th>
        <th>Opportunities</th>
        <th>Stale</th>
        <th>Pipeline</th>
      </tr>
    </thead>

    <tbody>
  `;

  data.forEach(x => {

    html += `
      <tr>

        <td>${safe(x.account)}</td>

        <td>${safe(x.am)}</td>

        <td>
          ${formatNumber(x.opportunities)}
        </td>

        <td class="${x.stale > 0 ? "stale" : "good"}">
          ${formatNumber(x.stale)}
        </td>

        <td>
          ${formatCurrency(x.pipeline)}
        </td>

      </tr>
    `;
  });

  html += `
    </tbody>
  </table>
  `;

  document.getElementById(
    "accountTable"
  ).innerHTML = html;
}


/**
 * Opportunity table
 */
function renderOpportunityTable(data) {

  if (!data.length) {

    document.getElementById(
      "opportunityTable"
    ).innerHTML =
      '<div class="empty">No opportunity data</div>';

    return;
  }

  let html = `
  <table>

    <thead>
      <tr>
        <th>Opportunity</th>
        <th>Account</th>
        <th>AM</th>
        <th>Stage</th>
        <th>Value</th>
        <th>Stale</th>
      </tr>
    </thead>

    <tbody>
  `;

  data.forEach(x => {

    html += `
      <tr>

        <td>${safe(x.opportunity)}</td>

        <td>${safe(x.account)}</td>

        <td>${safe(x.am)}</td>

        <td>${safe(x.stage)}</td>

        <td>${formatCurrency(x.value)}</td>

        <td class="${x.stale ? "stale" : "good"}">
          ${x.stale ? "YES" : "NO"}
        </td>

      </tr>
    `;
  });

  html += `
    </tbody>
  </table>
  `;

  document.getElementById(
    "opportunityTable"
  ).innerHTML = html;
}


/**
 * Empty
 */
function showEmpty() {

  document.getElementById(
    "totalAMs"
  ).textContent = "0";

  document.getElementById(
    "totalAccounts"
  ).textContent = "0";

  document.getElementById(
    "totalOpportunities"
  ).textContent = "0";

  document.getElementById(
    "staleCount"
  ).textContent = "0";

  document.getElementById(
    "openPipeline"
  ).textContent = "0";

  document.getElementById(
    "pipelineValue"
  ).textContent = "0";
}


/**
 * Helpers
 */
function formatNumber(value) {

  return Number(value || 0)
    .toLocaleString("en-IN");
}


function formatCurrency(value) {

  return Number(value || 0)
    .toLocaleString(
      "en-IN",
      {
        maximumFractionDigits: 0
      }
    );
}


function safe(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}


function setStatus(message) {

  document.getElementById(
    "status"
  ).textContent = message;
}


/**
 * Default date
 */
document.getElementById(
  "datePicker"
).value =
  new Date()
    .toISOString()
    .slice(0, 10);


/**
 * Automatically load latest
 */
loadLatest();

</script>

</body>
</html>
