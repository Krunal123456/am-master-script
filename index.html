<script>
const API_URL='https://script.google.com/macros/s/AKfycbx3qW2bLf9aec5FYUoJRuv87X10VvzRFSFHZL5YDfjFCGmoK3If5tT_sUZzqAVkgKKe/exec';

const state={
  staleFile:null,
  pipelineFile:null,
  report:null,
  history:[]
};

const $=id=>document.getElementById(id);

const norm=v=>
  String(v??'')
    .trim()
    .toLowerCase()
    .replace(/\s+/g,' ');

const normKey=v=>
  norm(v).replace(/[^a-z0-9]+/g,'');

const esc=v=>
  String(v??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#039;'
  }[c]));

const yes=v=>
  ['yes','true','1'].includes(norm(v));

const summary=v=>{
  const n=norm(v);
  return [
    'subtotal',
    'total',
    'grand total',
    'unassigned',
    'n/a',
    'na',
    'none'
  ].includes(n)
  || n.startsWith('subtotal')
  || n.startsWith('grand total');
};

const field=(r,names)=>{
  for(const n of names){
    if(
      r[n]!==undefined &&
      r[n]!==null &&
      String(r[n]).trim()!==''
    ){
      return r[n];
    }
  }
  return '';
};

const am=r=>field(r,[
  'AM',
  'Account Manager',
  'AccountManager',
  'AM Name',
  'AMName',
  'Account Owner',
  'Owner',
  'Opportunity Owner',
  'Opportunity Owner  ↑',
  'Sales Owner',
  'Sales Rep',
  'Sales Representative'
]);

const account=r=>field(r,[
  'Account Name',
  'Account',
  'Customer',
  'Customer Name',
  'Company',
  'AccountName',
  'CustomerName',
  'Client',
  'Client Name'
]);

const opp=r=>field(r,[
  'Opportunity Name',
  'Opportunity',
  'Opp Name',
  'Opp',
  'Deal Name',
  'Deal',
  'OpportunityName',
  'DealName'
]);

const stage=r=>field(r,[
  'Stage',
  'Opportunity Stage',
  'Stage  ↑'
]);

const next=r=>field(r,[
  'Next Action',
  'Next Step',
  'NextStep',
  'Action',

]);

const age=r=>

    field(r,[
      'Age',

      'No Activity Days'
    ]) || 0

const closeDate=r=>field(r,[

function toast(message){

function cleanRow(row){
  const result={};

  Object.keys(row).forEach(key=>{
    if(!summary(row[key])){
      result[key]=row[key];
    }
  });

  return result;
}

function headerScore(row){
  const values=row.map(v=>norm(v));

  return [
    'opportunity owner',
    'opportunity owner ↑',
    'account name',
    'opportunity name',
    'stage',
    'next step',
    'next action'
  ].filter(x=>values.includes(norm(x))).length;
}

function findHeader(rows){
  let best=-1;
  let score=0;

  for(
    let i=0;
    i<Math.min(rows.length,40);
    i++
  ){
    const currentScore=headerScore(rows[i]);

    if(currentScore>score){
      score=currentScore;
      best=i;
    }
  }

  return score>=2 ? best : -1;
}

function sheetToObjects(ws){

  const rows=XLSX.utils.sheet_to_json(
    ws,
    {
      header:1,
      defval:'',
      raw:false
    }
  );

  const headerIndex=findHeader(rows);

  if(headerIndex<0){
    return {
      headers:[],
      rows:[]
    };
  }

  const headers=rows[headerIndex]
    .map(
      (h,i)=>
        String(h||'').trim() ||
        ('Column '+(i+1))
    );

  const output=[];
  let owner='';

  const ownerIndex=headers.findIndex(
    h=>
      /opportunity owner/i.test(h) ||
      norm(h)==='am'
  );

  for(
    let i=headerIndex+1;
    i<rows.length;
    i++
  ){

    const values=rows[i];

    if(
      !values.some(
        v=>String(v??'').trim()
      )
    ){
      continue;
    }

    if(ownerIndex>=0){

      const rawOwner=
        String(values[ownerIndex]??'').trim();

      if(rawOwner){
        owner=rawOwner;
      }

      if(owner){
        values[ownerIndex]=owner;
      }
    }

    const row={};

    headers.forEach(
      (header,index)=>{
        row[header]=values[index]??'';
      }
    );

    if(
      Object.values(row).some(summary)
    ){
      continue;
    }

    if(
      !account(row) &&
      !opp(row)
    ){
      continue;
    }

    output.push(
      cleanRow(row)
    );
  }

  return {
    headers,
    rows:output
  };
}

async function parseFile(file){

  const buffer=await file.arrayBuffer();

  const workbook=XLSX.read(
    buffer,
    {
      type:'array',
      cellDates:true
    }
  );

  let all=[];
  const sheets=[];

  workbook.SheetNames.forEach(
    name=>{
      const result=
        sheetToObjects(
          workbook.Sheets[name]
        );

      if(result.rows.length){

        all=all.concat(
          result.rows
        );

        sheets.push({
          name,
          count:result.rows.length
        });
      }
    }
  );

  return {
    rows:all,
    sheets
  };
}

function key(row){

  const accountKey=
    normKey(account(row));

  const opportunityKey=
    normKey(opp(row));

  return accountKey && opportunityKey
    ? accountKey+'|'+opportunityKey
    : '';
}

function buildMatch(
  pipeline,
  staleRows
){

  const exact=new Map();
  const opportunityOnly=new Map();

  pipeline.forEach(row=>{

    const exactKey=key(row);

    if(
      exactKey &&
      !exact.has(exactKey)
    ){
      exact.set(
        exactKey,
        row
      );
    }

    const opportunityKey=
      normKey(opp(row));

    if(opportunityKey){

      const list=
        opportunityOnly.get(
          opportunityKey
        ) || [];

      list.push(row);

      opportunityOnly.set(
        opportunityKey,
        list
      );
    }
  });

  return staleRows.map(row=>{

    const exactKey=key(row);
    const opportunityKey=
      normKey(opp(row));

    let match=
      exactKey
        ? exact.get(exactKey)
        : null;

    if(
      !match &&
      opportunityKey &&
      opportunityOnly.get(opportunityKey)?.length===1
    ){
      match=
        opportunityOnly.get(
          opportunityKey
        )[0];
    }

    return {
      ...row,
      Stale:'YES',
      'Found in Open Pipeline':
        match ? 'YES' : 'NO',
      MatchType:
        match
          ? (
              exactKey &&
              exact.has(exactKey)
                ? 'Account + Opportunity'
                : 'Unique Opportunity'
            )
          : 'No Match'
    };
  });
}

function buildReport(
  staleParsed,
  pipelineParsed
){

  const pipeline=
    pipelineParsed.rows.filter(
      row=>!summary(am(row))
    );

  const staleRaw=
    staleParsed.rows.filter(
      row=>!summary(am(row))
    );

  const stale=
    buildMatch(
      pipeline,
      staleRaw
    );

  const staleMap=new Map();

  stale.forEach(row=>{
    const rowKey=key(row);

    if(rowKey){
      staleMap.set(
        rowKey,
        row
      );
    }
  });

  const consolidated=[];
  const seen=new Set();

  pipeline.forEach(row=>{

    const rowKey=key(row);

    const staleMatch=
      rowKey
        ? staleMap.get(rowKey)
        : null;

    const consolidatedRow={
      ...row,
      Stale:
        staleMatch ? 'YES' : 'NO',
      'Found in Open Pipeline':
        'YES',
      MatchType:
        staleMatch?.MatchType ||
        'Pipeline Only'
    };

    const signature=
      rowKey ||
      JSON.stringify(consolidatedRow);

    if(!seen.has(signature)){

      seen.add(signature);

      consolidated.push(
        consolidatedRow
      );
    }
  });

  stale.forEach(row=>{

    const rowKey=key(row);

    const signature=
      rowKey ||
      JSON.stringify(row);

    if(!seen.has(signature)){

      seen.add(signature);

      consolidated.push(row);
    }
  });

  const ams=[
    ...new Set(
      consolidated
        .map(am)
        .map(x=>String(x||'').trim())
        .filter(
          x=>
            x &&
            !summary(x)
        )
    )
  ].sort(
    (a,b)=>
      a.localeCompare(
        b,
        undefined,
        {
          sensitivity:'base'
        }
      )
  );

  const uniqueStale=
    consolidated.filter(
      row=>yes(row.Stale)
    );

  const matched=
    uniqueStale.filter(
      row=>
        yes(
          row['Found in Open Pipeline']
        )
    ).length;

  const unmatched=
    uniqueStale.length-matched;

  const accounts=[
    ...new Set(
      consolidated
        .map(
          row=>normKey(account(row))
        )
        .filter(Boolean)
    )
  ];

  return {

    consolidated,

    /*
     * Frontend naming
     */
    pipeline,

    /*
     * Backend compatibility
     */
    sales:pipeline,

    stale:uniqueStale,

    ams,

    staleCount:
      uniqueStale.length,

    matchedCount:
      matched,

    unmatchedCount:
      unmatched,

    totalAccounts:
      accounts.length,

    source:{
      staleSheets:
        staleParsed.sheets,

      pipelineSheets:
        pipelineParsed.sheets
    },

    generatedAt:
      new Date().toISOString()
  };
}

function cols(row){

  return {
    AM:am(row),
    Account:account(row),
    Opportunity:opp(row),
    Stage:stage(row),
    'Next Action':next(row),
    Stale:
      yes(row.Stale)
        ? 'YES'
        : 'NO',
    'Found in Open Pipeline':
      yes(
        row['Found in Open Pipeline']
      )
        ? 'YES'
        : 'NO',
    'Match Type':
      row.MatchType || '',
    'Close Date':
      closeDate(row),
    'Last Activity':
      lastActivity(row),
    Age:
      age(row)
  };
}

function displayRows(rows){
  return rows.map(cols);
}

function group(rows,fn){

  const map=new Map();

  rows.forEach(row=>{

    const groupName=
      fn(row) || 'Unknown';

    map.set(
      groupName,
      (map.get(groupName)||0)+1
    );
  });

  return [...map]
    .map(
      ([k,n])=>({
        k,
        n
      })
    )
    .sort(
      (a,b)=>b.n-a.n
    );
}

function bars(rows,id){

  const values=
    group(rows,stage);

  const maximum=
    Math.max(
      1,
      ...values.map(x=>x.n)
    );

  $(id).innerHTML=
    values
      .slice(0,12)
      .map(
        x=>`
          <div class="barrow">
            <div
              class="barlabel"
              title="${esc(x.k)}"
            >
              ${esc(x.k)}
            </div>

            <div class="bar">
              <i style="width:${x.n/maximum*100}%"></i>
            </div>

            <b>${x.n}</b>
          </div>
        `
      )
      .join('')
      ||
      '<div class="empty">No data</div>';
}

function renderBars(){

  bars(
    state.report.pipeline,
    'stageBars'
  );

  bars(
    state.report.stale,
    'staleBars'
  );
}

function amStats(amName){

  const rows=
    state.report.consolidated.filter(
      row=>
        norm(am(row))===
        norm(amName)
    );

  const pipeline=
    rows.filter(
      row=>
        yes(
          row['Found in Open Pipeline']
        )
    );

  const stale=
    rows.filter(
      row=>yes(row.Stale)
    );

  const unmatched=
    stale.filter(
      row=>
        !yes(
          row['Found in Open Pipeline']
        )
    );

  const noNext=
    stale.filter(
      row=>!next(row)
    );

  const percentage=
    rows.length
      ? stale.length/rows.length*100
      : 0;

  const health=
    percentage>=25
      ? 'red'
      : percentage>=12
        ? 'amber'
        : 'green';

  return {
    rows,
    p:pipeline.length,
    s:stale.length,
    u:unmatched.length,
    n:noNext.length,
    pct:percentage,
    health
  };
}

function healthPill(health){

  return `
    <span class="pill ${health}">
      ${
        health==='red'
          ? 'ATTENTION'
          : health==='amber'
            ? 'WATCH'
            : 'HEALTHY'
      }
    </span>
  `;
}

        .join('');
  };

  fill(
    'pAM',
    state.report.ams,
    'All AMs'
  );

  fill(
    'sAM',
    state.report.ams,
    'All AMs'
  );

  fill(
    'pStage',
    [
      ...new Set(
        state.report.pipeline
          .map(stage)
          .filter(Boolean)
      )
    ].sort(),
    'All Stages'

  return yes(
    row['Found in Open Pipeline']
  )
    ? '<span class="pill green">FOUND</span>'
    : '<span class="pill red">NOT FOUND</span>';
}

function row(rowData){

    yes(rowData.Stale);

  return `
    <tr
      class="${isStale?'stale':''}"
      data-opp="${esc(opp(rowData))}"
    >
      <td>${esc(am(rowData))}</td>

      <td>${esc(account(rowData))}</td>

      <td>
        <b>${esc(opp(rowData))}</b>
      </td>

      <td>${esc(stage(rowData))}</td>

      <td>${esc(next(rowData)||'—')}</td>

      <td>
        ${
          isStale
            ? '<span class="pill red">YES</span>'
            : '<span class="pill green">NO</span>'
        }
      </td>

      <td>
        ${matchPill(rowData)}
      </td>
    </tr>
  `;
}

function renderPipeline(){

  const query=
    norm($('pSearch').value);

  const selectedAM=
    norm($('pAM').value);

  const selectedStage=
    norm($('pStage').value);

  const selectedStale=
    norm($('pStale').value);

  const rows=
    state.report.pipeline.filter(
      rowData=>
        (
          !selectedAM ||
          norm(am(rowData))===
          selectedAM
        ) &&
        (
          !selectedStage ||
          norm(stage(rowData))===
          selectedStage
        ) &&
        (
          !selectedStale ||
          norm(rowData.Stale)===
          selectedStale
        ) &&
        (
          !query ||
          norm([
            am(rowData),
            account(rowData),
            opp(rowData),
            stage(rowData),
            next(rowData)
          ].join(' '))
          .includes(query)
        )
    );

  $('pipelineTable').innerHTML=
    rows
      .slice(0,1000)
      .map(row)
      .join('')
      ||
      `
        <tr>
          <td
            colspan="7"
            class="empty"
          >
            No opportunities match your filters.
          </td>
        </tr>
      `;
}

function renderStale(){

  const query=
    norm($('sSearch').value);

  const selectedAM=
    norm($('sAM').value);

  const selectedMatch=
    norm($('sMatch').value);

  const selectedAge=
    Number(
      $('sAge').value || 0
    );

  const rows=
    state.report.stale.filter(
      rowData=>
        (
          !selectedAM ||
          norm(am(rowData))===
          selectedAM
        ) &&
        (
          !selectedMatch ||
          (
            yes(
              rowData[
                'Found in Open Pipeline'
              ]
            )
              ? 'yes'
              : 'no'
          )===
          selectedMatch
        ) &&
        (
          !selectedAge ||
          age(rowData)>=selectedAge
        ) &&
        (
          !query ||
          norm([
            am(rowData),
            account(rowData),
            opp(rowData),
            stage(rowData),
            next(rowData)
          ].join(' '))
          .includes(query)
        )
    );

  $('staleTable').innerHTML=
    rows
      .slice(0,1000)
      .map(row)
      .join('')
      ||
      `
        <tr>
          <td
            colspan="7"
            class="empty"
          >
            No stale opportunities match your filters.
          </td>
        </tr>
      `;
}

function renderAccounts(){

  const query=
    norm($('aSearch').value);

  const map=new Map();

  state.report.consolidated
    .forEach(rowData=>{

      const accountName=
        account(rowData) ||
        'Unknown';

      if(
        query &&
        !norm(accountName)
          .includes(query)
      ){
        return;
      }

      const accountKey=
        normKey(accountName);

      let item=
        map.get(accountKey) ||
        {
          a:accountName,
          am:am(rowData),
          n:0,
          s:0,
          u:0
        };

      item.n++;

      if(yes(rowData.Stale)){

        item.s++;

        if(
          !yes(
            rowData[
              'Found in Open Pipeline'
            ]
          )
        ){
          item.u++;
        }
      }

      map.set(
        accountKey,
        item
      );
    });

  $('accountsTable').innerHTML=
    [...map.values()]
      .sort(
        (a,b)=>
          b.s-a.s ||
          b.n-a.n
      )
      .map(
        item=>`
          <tr>
            <td>
              <b>${esc(item.a)}</b>
            </td>

            <td>${esc(item.am)}</td>
            <td>${item.n}</td>
            <td>${item.s}</td>
            <td>${item.u}</td>

            <td>
              ${healthPill(
                item.s
                  ? 'red'
                  : 'green'
              )}
            </td>
          </tr>
        `
      )
      .join('')
      ||
      `
        <tr>
          <td
            colspan="6"
            class="empty"
          >
            No accounts.
          </td>
        </tr>
      `;
}

function renderQuality(){

  const report=
    state.report;

  const noNext=
    report.consolidated
      .filter(
        row=>!next(row)
      ).length;

  const noAM=
    report.consolidated
      .filter(
        row=>!am(row)
      ).length;

  const noAccount=
    report.consolidated
      .filter(
        row=>!account(row)
      ).length;

  $('qualityList').innerHTML=`

    <div class="metric">
      <span>AM Stale sheets read</span>
      <b>${report.source.staleSheets.length}</b>
    </div>

    <div class="metric">

/* =========================================================
   API
   ========================================================= */

async function api(
  action,
  payload={}
){

  const request={
    action,
    ...payload
  };

  let response;

  try{

    response=
      await fetch(
        API_URL,
        {
          method:'POST',

          headers:{
            'Content-Type':
              'text/plain;charset=utf-8'
          },

          body:
            JSON.stringify(request),

          redirect:'follow'
        }
      );

  }catch(error){

    console.error(
      'Network/API connection error:',
      error
    );

    throw new Error(
      'Unable to connect to Google Apps Script. Check that the Web App is deployed and the /exec URL is correct.'
    );
  }

  const raw=
    await response.text();

  if(!response.ok){

    console.error(
      'Apps Script HTTP error:',
      response.status,
      raw
    );

    throw new Error(
      `Apps Script HTTP ${response.status}: ${raw.substring(0,500)}`
    );
  }

  let data;

  try{

    data=
      JSON.parse(raw);

  }catch(error){

    console.error(
      'Invalid Apps Script response:',
      raw
    );

    throw new Error(
      'Apps Script did not return valid JSON. Make sure the latest Web App deployment is being used.'
    );
  }

  if(
    !data ||
    data.ok!==true
  ){

    throw new Error(
      data?.error ||
      data?.message ||
      `Apps Script rejected action: ${action}`
    );
  }

  return data;
}


/* =========================================================
   SAVE REPORT
   ========================================================= */

async function save(){

  if(!state.report){

    toast(
      'Generate a report first.'
    );

    return;
  }

  const button=
    $('save');

  try{

    button.disabled=true;

    toast(
      'Saving report to Drive…'
    );

    status(
      'Preparing report for Google Drive…',
      85
    );

    /*
     * IMPORTANT:
     *
     * The browser calls this property "pipeline".
     *
     * Apps Script/report generation commonly expects
     * "sales".
     *
     * We send BOTH.
     */

    const reportForDrive={

      ...state.report,

      pipeline:
        Array.isArray(
          state.report.pipeline
        )
          ? state.report.pipeline
          : [],

      sales:
        Array.isArray(
          state.report.pipeline
        )
          ? state.report.pipeline
          : (
              Array.isArray(
                state.report.sales
              )
                ? state.report.sales
                : []
            ),

      stale:
        Array.isArray(
          state.report.stale
        )
          ? state.report.stale
          : [],

      consolidated:
        Array.isArray(
          state.report.consolidated
        )
          ? state.report.consolidated
          : [],

      ams:
        Array.isArray(
          state.report.ams
        )
          ? state.report.ams
          : []
    };

    const result=
      await api(
        'saveReport',
        {
          report:
            reportForDrive
        }
      );

    if(
      !result.fileId
    ){

      throw new Error(
        'The report was processed, but Google Drive did not return a file ID.'
      );
    }

    state.report.fileId=
      result.fileId;

    state.report._fileId=
      result.fileId;

    state.report.driveUrl=
      result.driveUrl || '';

    state.report.sales=
      reportForDrive.sales;

    status(
      'Report saved successfully to Google Drive.',
      100
    );

    toast(
      '✓ Report saved to Google Drive.'
    );

    /*
     * History refresh must never make a successful
     * save appear to have failed.
     */

    try{

      await loadHistory();

    }catch(historyError){

      console.warn(
        'History refresh failed:',
        historyError
      );
    }

  }catch(error){

    console.error(
      'SAVE REPORT ERROR:',
      error
    );

    status(
      'Save failed: '+
      (
        error.message ||
        String(error)
      ),
      0
    );

    toast(
      'Save failed: '+
      (
        error.message ||
        String(error)
      )
    );

  }finally{

    button.disabled=false;
  }
}

async function send(){

  if(!state.report){

    toast(
      'Generate a report first.'
    );

    return;
  }

  try{

    $('send').disabled=true;

    /*
     * Always make sure the report exists in Drive
     * before attempting email delivery.
     */

    if(!state.report.fileId){

      toast(
        'Saving report before sending emails…'
      );

      const reportForDrive={

        ...state.report,

        pipeline:
          Array.isArray(
            state.report.pipeline
          )
            ? state.report.pipeline
            : [],

        sales:
          Array.isArray(
            state.report.pipeline
          )
            ? state.report.pipeline
            : (
                Array.isArray(
                  state.report.sales
                )
                  ? state.report.sales
                  : []
              ),

        stale:
          Array.isArray(
            state.report.stale
          )
            ? state.report.stale
            : [],

        consolidated:
          Array.isArray(
            state.report.consolidated
          )
            ? state.report.consolidated
            : [],

        ams:
          Array.isArray(
            state.report.ams
          )
            ? state.report.ams
            : []
      };

      const saved=
        await api(
          'saveReport',
          {
            report:
              reportForDrive
          }
        );

      if(!saved.fileId){

        throw new Error(
          'Report could not be saved to Drive, so emails were not sent.'
        );
      }

      state.report.fileId=
        saved.fileId;

      state.report._fileId=
        saved.fileId;

      state.report.driveUrl=
        saved.driveUrl || '';

      state.report.sales=
        reportForDrive.sales;
    }

    toast(
      'Sending individual AM emails…'
    );

    const result=
      await api(
        'sendEmails',
        {
          fileId:
            state.report.fileId,

          report:{
            ...state.report,

            sales:
              state.report.sales ||
              state.report.pipeline ||
              []
          }
        }
      );

    toast(
      `✓ Email process completed. Sent: ${
        result.sent || 0
      }, skipped: ${
        result.skipped || 0
      }.`
    );

  }catch(error){

    console.error(
      'EMAIL ERROR:',
      error
    );

    toast(
      'Email failed: '+
      (
        error.message ||
        String(error)
      )
    );

  }finally{

    $('send').disabled=false;
  }
}


/* =========================================================
   EXCEL DOWNLOAD
   ========================================================= */

function download(){

  if(!state.report){

    toast(
      'Generate a report first.'
    );

    return;
  }

  try{

    const workbook=
      XLSX.utils.book_new();

    const addSheet=(
      name,
      rows
    )=>{

      const safe=
        displayRows(rows);

      const worksheet=
        XLSX.utils.json_to_sheet(
          safe.length
            ? safe
            : [
                {
                  Message:
                    'No data'
                }
              ]
        );

      XLSX.utils.book_append_sheet(
        workbook,
        worksheet,
        name.slice(0,31)
      );
    };

    addSheet(
      'Manager Summary',
      [
        {
          Report_Date:
            new Date(
              state.report.generatedAt
            ).toLocaleString(),

          Open_Pipeline:
            state.report.pipeline.length,

          Stale:
            state.report.staleCount,

          AMs:
            state.report.ams.length,

          Found_in_Pipeline:
            state.report.matchedCount,

          Unmatched_Stale:
            state.report.unmatchedCount,

          Match_Rate:
            (
              state.report.staleCount
                ? (
                    state.report.matchedCount /
                    state.report.staleCount *
                    100
                  )
                : 0
            ).toFixed(1)+'%'
        }
      ]
    );

    addSheet(
      'Consolidated',
      state.report.consolidated
    );

    addSheet(
      'Sales Open Pipeline',
      state.report.pipeline
    );

    addSheet(
      'Stale Opportunities',
      state.report.stale
    );

    state.report.ams.forEach(
      amName=>{
        addSheet(
          amName,
          state.report.consolidated
            .filter(
              row=>
                norm(am(row))===
                norm(amName)
            )
        );
      }
    );

    XLSX.writeFile(
      workbook,
      'AM_Pulse_Report_'+
      new Date()
        .toISOString()
        .slice(0,10)+
      '.xlsx'
    );

    toast(
      '✓ Excel report downloaded.'
    );

  }catch(error){

    console.error(
      'Excel download error:',
      error
    );

    toast(
      'Excel download failed: '+
      error.message
    );
  }
}

async function generate(){

  if(
    !state.staleFile ||
    !state.pipelineFile
  ){
    return;
  }

  try{

    $('generate').disabled=true;

    status(
      'Reading AM Stale Report…',
      20
    );

    const stale=
      await parseFile(
        state.staleFile
      );

    status(
      'Reading Open Pipeline Report…',
      40
    );

    const pipeline=
      await parseFile(
        state.pipelineFile
      );

    if(!stale.rows.length){

      throw new Error(
        'No data rows were found in the AM Stale Report.'
      );
    }

    if(!pipeline.rows.length){

      throw new Error(
        'No data rows were found in the Open Pipeline Report.'
      );
    }

    status(
      'Matching stale opportunities against open pipeline…',
      65
    );

    state.report=
      buildReport(
        stale,
        pipeline
      );

    status(
      'Building manager dashboard…',
      90
    );

    render();

    $('uploadCard').style.display='none';

    status(
      'Report ready.',
      100
    );

    toast(
      `Report ready: ${
        state.report.pipeline.length
      } pipeline, ${
        state.report.staleCount
      } stale, ${
        state.report.ams.length
      } AMs.`
    );

  }catch(error){

    console.error(
      'Generation error:',
      error
    );

    status(
      'Generation failed: '+
      error.message,
      0
    );

    toast(
      'Generation failed: '+
      error.message
    );

  }finally{

    $('generate').disabled=false;
  }
}

    'Drop Excel here or click to browse';

    .classList

  $('pipelineDrop')

  $('generate').disabled=true;

  status(
    'Waiting for both files.',
    0
  );

function fileSet(
  kind,
  file
){

  if(!file){
    return;
  }

  state[kind]=file;

  const isStale=
    kind==='staleFile';

  $(
    isStale
      ? 'staleName'
      : 'pipelineName'
  ).textContent=
    file.name;

  $(
    isStale
      ? 'staleDrop'
      : 'pipelineDrop'
  )
    .classList
    .add('ready');

  $('generate').disabled=
    !(
      state.staleFile &&
      state.pipelineFile
    );

  if(
    state.staleFile &&
    state.pipelineFile
  ){

    status(
      'Both files ready. Generate the report.',
      30
    );
  }
}

            )}
          </div>

          <div class="detail">
            <b>Next Action</b>
            ${esc(
              next(matchingRow)||'—'
            )}
          </div>

          <div class="detail">
            <b>Stale</b>

            ${
              yes(matchingRow.Stale)
                ? '<span class="pill red">YES</span>'
                : '<span class="pill green">NO</span>'
            }
          </div>

          <div class="detail">
            <b>Pipeline Match</b>
            ${matchPill(matchingRow)}
          </div>

          <div class="detail">
            <b>Age</b>
            ${esc(
              age(matchingRow)||'—'
            )}
          </div>
        `;

        $('drawerBg')
          .classList
          .add('open');

        $('drawer')
          .classList
          .add('open');
      }
    }
  }
);


/* =========================================================
   FILTERS
   ========================================================= */

[
  'pSearch',
  'pAM',
  'pStage',
  'pStale'
].forEach(
  id=>{
    $(id).addEventListener(
      'input',
      renderPipeline
    );
  }
);

[
  'sSearch',
  'sAM',
  'sMatch',
  'sAge'
].forEach(
  id=>{
    $(id).addEventListener(
      'input',
      renderStale
    );
  }
);

$('aSearch')
  .addEventListener(
    'input',
    renderAccounts
  );


/* =========================================================
   BUTTONS
   ========================================================= */

$('drawerClose').onclick=()=>{

  $('drawer')
    .classList
    .remove('open');

  $('drawerBg')
    .classList
    .remove('open');
};

$('drawerBg').onclick=
  $('drawerClose').onclick;

$('refresh').onclick=()=>{

  if(state.report){

    render();

  }else{

    location.reload();
  }
};

$('download').onclick=
  download;

$('save').onclick=
  save;

$('send').onclick=
  send;

$('changeFiles').onclick=
  resetFiles;

$('generate').onclick=
  generate;


/* =========================================================
   FILE INPUTS
   ========================================================= */

$('staleFile').onchange=
  event=>{

    fileSet(
      'staleFile',
      event.target.files[0]
    );
  };

$('pipelineFile').onchange=
  event=>{

    fileSet(
      'pipelineFile',
      event.target.files[0]
    );
  };


/* =========================================================
   INITIAL HISTORY
   ========================================================= */

loadHistory();


/* =========================================================
   DRAG & DROP
   ========================================================= */

[
  'staleDrop',
  'pipelineDrop'
].forEach(id=>{

  const element=$(id);

  [
    'dragenter',
    'dragover'
  ].forEach(
    eventName=>{

      element.addEventListener(
        eventName,
        event=>{
          event.preventDefault();
          element.style.borderColor=
            '#60a5fa';
        }
      );
    }
  );

  [
    'dragleave',
    'drop'
  ].forEach(
    eventName=>{

      element.addEventListener(
        eventName,
        event=>{
          event.preventDefault();
          element.style.borderColor='';
        }
      );
    }
  );

  element.addEventListener(
    'drop',
    event=>{

      const file=
        event.dataTransfer.files[0];

      if(!file){
        return;
      }

      const kind=
        id==='staleDrop'
          ? 'staleFile'
          : 'pipelineFile';

      fileSet(
        kind,
        file
      );
    }
  );
});

</script>
